<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#446b60"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Unsere Familienbibliothek</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f7f7f3;color:#23332f;margin:0}main{max-width:720px;margin:auto;padding:20px}header{background:#dcebe3;border-radius:20px;padding:20px}h1{margin:4px 0 12px}button,input,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #b8c9c0}button{background:#446b60;color:white;border:0;cursor:pointer}button.secondary{background:#e2e9e5;color:#23332f}nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}nav button{flex:1}section{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0000000a}.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.line>*{flex:1;min-width:100px}input,select{box-sizing:border-box;max-width:100%}label{display:block;margin:12px 0 5px;font-weight:600}.muted{color:#66766e;font-size:.9rem}.item{border-bottom:1px solid #e3e8e4;padding:14px 0}.item:last-child{border:0}.tag{display:inline-block;background:#e5f2eb;border-radius:12px;padding:3px 9px;font-size:.8rem}#status{min-height:20px;color:#346d4a}button:disabled{opacity:.5}</style></head><body><main><header><small>UNSERE FAMILIENBIBLIOTHEK</small><h1>📚 Unser Bücherregal</h1><div id="counts"></div></header><nav><button onclick="view='books';render()">Bücher</button><button onclick="view='add';render()">Hinzufügen</button><button onclick="view='loans';render()">Verliehen</button><button onclick="view='gifts';render()">Geschenke</button><button onclick="view='settings';render()">Einstellungen</button></nav><p id="status" role="status"></p><div id="content"></div></main><script>
const KEY='familienbibliothek-v1';let db={books:[],locations:['Gemeinsames Bücherregal','Kinderzimmer','Elternzimmer'],gifts:[]};try{let x=localStorage.getItem(KEY);if(x){let p=JSON.parse(x);if(Array.isArray(p.books)&&Array.isArray(p.locations)&&Array.isArray(p.gifts))db=p}}catch(e){}let view='books',filter='';const el=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db));msg('Gespeichert. Bitte regelmäßig eine Sicherung exportieren.');return true}catch(e){msg('Speichern fehlgeschlagen: Browserspeicher nicht verfügbar oder voll.');return false}}function msg(s){el('status').textContent=s}function options(selected){return db.locations.map(x=>`<option ${x===selected?'selected':''}>${safe(x)}</option>`).join('')}function render(){el('counts').textContent=`${db.books.length} Bücher · ${db.books.filter(b=>b.borrower).length} verliehen · ${db.gifts.length} Geschenke`;let html='';if(view==='books'||view==='loans'){html=`<section><input id="search" placeholder="Titel, Autor oder ISBN suchen" value="${safe(filter)}" oninput="filter=this.value;drawList()" style="width:100%"><div id="list"></div></section>`}else if(view==='add'){html=`<section><h2>Buch hinzufügen</h2><form id="bookForm"><label>Titel *</label><input name="title" required style="width:100%"><label>Autor</label><input name="author" style="width:100%"><label>ISBN (optional)</label><input name="isbn" inputmode="numeric" style="width:100%"><label>Standort</label><select name="location">${options('Kinderzimmer')}</select><p><button>Speichern</button></p></form></section>`}else if(view==='gifts'){html=`<section><h2>Verschenkte Bücher</h2><form id="giftForm"><label>Buchtitel *</label><input name="title" required><label>Empfänger *</label><input name="person" required><label>Anlass</label><input name="occasion" placeholder="Geburtstag, Weihnachten …"><label>Datum</label><input name="date" type="date"><p><button>Geschenk erfassen</button></p></form></section><section>${db.gifts.map(g=>`<div class="item"><b>${safe(g.title)}</b><p class="muted">${safe(g.person)} · ${safe(g.occasion)} · ${safe(g.date)}</p><button class="secondary" onclick="removeGift('${g.id}')">Entfernen</button></div>`).join('')||'Noch keine Geschenke erfasst.'}</section>`}else{html=`<section><h2>Standorte</h2><div>${db.locations.map(l=>`<p>📍 ${safe(l)}</p>`).join('')}</div><form id="locationForm"><label>Neuen Standort anlegen</label><div class="line"><input name="name" required placeholder="z. B. Max’ Zimmer"><button>Hinzufügen</button></div></form></section><section><h2>Datensicherung</h2><p class="muted">Exportiere regelmäßig eine vollständige JSON-Sicherung. Beim Import wird der aktuelle Bestand ersetzt.</p><button onclick="backup()">Sicherung herunterladen</button><label>Sicherung wiederherstellen</label><input type="file" id="restore" accept="application/json,.json" onchange="restoreFile(this)"></section>`}el('content').innerHTML=html;if(view==='books'||view==='loans')drawList();if(el('bookForm'))el('bookForm').onsubmit=addBook;if(el('giftForm'))el('giftForm').onsubmit=addGift;if(el('locationForm'))el('locationForm').onsubmit=addLocation}
function drawList(){let arr=db.books.filter(b=>(view!=='loans'||b.borrower)&&[b.title,b.author,b.isbn].some(s=>String(s||'').toLowerCase().includes(filter.toLowerCase())));el('list').innerHTML=arr.map(b=>`<div class="item"><b>📖 ${safe(b.title)}</b><p class="muted">${safe(b.author)} ${b.isbn?'· ISBN '+safe(b.isbn):''}</p><p><span class="tag">${safe(b.location)}</span> ${b.borrower?'<span class="tag">Verliehen: '+safe(b.borrower)+'</span>':''}</p><div class="line"><button class="secondary" onclick="moveBook('${b.id}')">Umlagern</button><button class="secondary" onclick="loanBook('${b.id}')">${b.borrower?'Rückgabe':'Verleihen'}</button><button class="secondary" onclick="editBook('${b.id}')">Bearbeiten</button><button class="secondary" onclick="deleteBook('${b.id}')">Löschen</button></div></div>`).join('')||'<p class="muted">Keine passenden Bücher gefunden.</p>'}function addBook(e){e.preventDefault();let f=new FormData(e.target);db.books.push({id:crypto.randomUUID(),title:f.get('title').trim(),author:f.get('author').trim(),isbn:f.get('isbn').trim(),location:f.get('location'),borrower:'',date:''});if(save()){view='books';filter='';render()}}function getBook(id){return db.books.find(b=>b.id===id)}function moveBook(id){let b=getBook(id),n=prompt('Neuer Standort (vorhandenen Namen eingeben):\n'+db.locations.join(' / '),b.location);if(n===null)return;n=n.trim();if(!db.locations.includes(n)){msg('Standort nicht vorhanden. Bitte zuerst unter Einstellungen anlegen.');return}b.location=n;save();render()}function loanBook(id){let b=getBook(id);if(b.borrower){if(confirm('Rückgabe bestätigen?')){b.borrower='';b.date='';save();render()}}else{let n=prompt('An wen verleihst du das Buch?');if(n?.trim()){b.borrower=n.trim();b.date=new Date().toISOString().slice(0,10);save();render()}}}function editBook(id){let b=getBook(id),n=prompt('Buchtitel',b.title);if(n===null||!n.trim())return;b.title=n.trim();let a=prompt('Autor',b.author);if(a!==null)b.author=a.trim();save();render()}function deleteBook(id){if(confirm('Buch wirklich löschen?')){db.books=db.books.filter(b=>b.id!==id);save();render()}}function addGift(e){e.preventDefault();let f=new FormData(e.target);db.gifts.push({id:crypto.randomUUID(),title:f.get('title').trim(),person:f.get('person').trim(),occasion:f.get('occasion').trim(),date:f.get('date')});save();render()}function removeGift(id){if(confirm('Geschenkeintrag löschen?')){db.gifts=db.gifts.filter(g=>g.id!==id);save();render()}}function addLocation(e){e.preventDefault();let n=new FormData(e.target).get('name').trim();if(n&&!db.locations.some(x=>x.toLowerCase()===n.toLowerCase())){db.locations.push(n);save();render()}}function backup(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='familienbibliothek-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restoreFile(input){let file=input.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.books)||!Array.isArray(d.locations)||!Array.isArray(d.gifts))throw Error('Ungültige Sicherungsdatei');if(!confirm('Aktuelle Daten durch die Sicherung ersetzen?'))return;db={books:d.books,locations:d.locations,gifts:d.gifts};save();render()}catch(e){msg('Import fehlgeschlagen: '+e.message)}}if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
